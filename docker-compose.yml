version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: travel-buddy-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: travel_buddy_india
      MYSQL_USER: travelbuddy
      MYSQL_PASSWORD: travelbuddy
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: maven:3.9.9-eclipse-temurin-17
    container_name: travel-buddy-backend
    working_dir: /app/backend
    command: mvn spring-boot:run
    env_file:
      - .env
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/travel_buddy_india
      MYSQL_USERNAME: travelbuddy
      MYSQL_PASSWORD: travelbuddy
    volumes:
      - ./:/app
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: node:20
    container_name: travel-buddy-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_TRAVEL_BUDDY_API_BASE_URL: http://localhost:8080/api
    volumes:
      - ./:/app
    ports:
      - "9002:9002"
    depends_on:
      - backend

volumes:
  mysql-data:
