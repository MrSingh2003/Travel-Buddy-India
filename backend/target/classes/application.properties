spring.application.name=travel-buddy-india-backend
server.port=8080
management.endpoints.web.exposure.include=health,info
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/travel_buddy_india}
spring.datasource.username=${MYSQL_USERNAME:travelbuddy}
spring.datasource.password=${MYSQL_PASSWORD:travelbuddy}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
google.ai.api-key=${GEMINI_API_KEY:}
searchapi.api-key=${SEARCHAPI_API_KEY:}
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
