spring:
  application:
    name: travel-buddy-india-backend
  config:
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL:${MYSQL_URL:jdbc:h2:file:./data/travel_buddy_india;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}}
    username: ${DB_USER:${MYSQL_USERNAME:sa}}
    password: ${DB_PASS:${MYSQL_PASSWORD:}}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

google:
  ai:
    api-key: ${GEMINI_API_KEY:}
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}

searchapi:
  api-key: ${SEARCHAPI_API_KEY:}

rapidapi:
  key: ${RAPIDAPI_KEY:}
  webhook-url: ${RAPIDAPI_WEBHOOK_URL:}

support:
  # Comma-separated recipient list. Example: support@yourdomain.com,helpdesk@yourdomain.com
  notification:
    emails: ${SUPPORT_NOTIFICATION_EMAILS:}
  # SMTP "from" identity (must be allowed by your provider). If not set, spring.mail.username is used.
  mail:
    from: ${SUPPORT_MAIL_FROM:}
