name: travel-buddy-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: travel_buddy_india
          MYSQL_USER: travelbuddy
          MYSQL_PASSWORD: travelbuddy
          MYSQL_ROOT_PASSWORD: rootpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Run backend tests
        working-directory: backend
        env:
          MYSQL_URL: jdbc:mysql://127.0.0.1:3306/travel_buddy_india
          MYSQL_USERNAME: travelbuddy
          MYSQL_PASSWORD: travelbuddy
        run: mvn -B test
